[package]
name = "hidpilot-gui"
version = "0.1.0"
description = "Graphical settings for Logitech peripherals"
license = "MIT"
edition = "2024"

[[bin]]
name = "hidpilot-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hidpilot = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
toml = "1.1.8"
tauri-plugin-single-instance = "2"
x11rb = "0.14"
