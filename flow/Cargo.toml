[package]
name = "hidpilot-flow"
version = "1.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
blake2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hostname = "0.4.2"
mdns-sd = "0.21.5"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4.0"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"

hidpilot = { version = "1.0.1", path = ".." }
if-addrs = "0.15.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
