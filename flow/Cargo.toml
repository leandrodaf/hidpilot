[package]
name = "hidpilot-flow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
blake2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hostname = "0.4.2"
mdns-sd = "0.21.5"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
spake2 = "0.4.0"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
hidpilot = { version = "0.1.0", path = ".." }
x11rb = { version = "0.14.0", features = ["randr"] }
