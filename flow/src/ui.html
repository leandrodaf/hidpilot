<title>Orbit Flow</title>
<style>
  :root { --bg: #f6f6f8; --card: #fff; --text: #1d1e20; --soft: #6f6e73; --line: #ececf0; --accent: #814efa; --accent-ink: #fff; --ok: #2fb35a; --bad: #d93a3a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d10; --card: #18181c; --text: #f2f2f4; --soft: #9a9aa2; --line: #2a2a30; --accent: #9a72ff; --accent-ink: #fff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; }
  header p { margin: 4px 0 22px; color: var(--soft); }
  h2 { font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--soft); margin: 26px 0 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 6px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 140px; }
  .name { font-weight: 600; }
  .sub { color: var(--soft); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); flex: none; }
  .dot.on { background: var(--ok); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--line); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.link { background: none; color: var(--soft); padding: 6px 8px; }
  button:disabled { opacity: .5; cursor: default; }
  select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .empty { padding: 16px 0; color: var(--soft); }
  .banner { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 18px 20px; margin-bottom: 8px; }
  .banner .code { font-size: 40px; font-weight: 700; letter-spacing: 6px; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .panel { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .panel h3 { margin: 0 0 10px; font-size: 17px; }
  .sides { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 46px); gap: 6px; justify-content: center; margin: 12px 0 16px; }
  .sides .me { grid-area: 2 / 2; border-radius: 8px; border: 2px solid var(--accent); display: grid; place-items: center; font-size: 11px; color: var(--soft); text-align: center; line-height: 1.1; }
  .sides button { padding: 0; border: 2px dashed var(--line); background: none; }
  .sides button.on { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  .code-in { font-size: 30px; letter-spacing: 8px; width: 100%; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
  .code-in:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .err { color: var(--bad); margin-top: 8px; }
  .toggle { width: 46px; height: 28px; border-radius: 14px; padding: 0; background: var(--line); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 21px; }
  .note { color: var(--soft); font-size: 13px; margin: 10px 2px 0; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>

      el("select", { "aria-label": t("where", { name: p.name }), onchange: (e) => act(() => call("place", { key: p.key, side: e.target.value })) },
        el("option", { value: "", selected: !p.side }, t("notPlaced")), SIDES.map((s) => el("option", { value: s, selected: p.side === s }, t(s)))),
      el("button", { class: "link", onclick: () => act(() => call("forget", { key: p.key })) }, t("forget")))) : el("div", { class: "empty" }, t("nonePaired"))));

  parts.push(el("h2", {}, t("nearby")));
  parts.push(el("div", { class: "card" }, st.nearby.length ? st.nearby.map((n) =>
    el("div", { class: "row" },
      el("div", { class: "grow" }, el("div", { class: "name" }, n.name)),
      el("button", { class: "primary", disabled: !!o && o.status !== "done" && o.status !== "failed", onclick: () => { picking = n; pickSide = null; render(); } }, t("connect")))) :
    el("div", { class: "empty" }, el("span", { class: "spin" }), t("searching"))));

  parts.push(el("h2", {}, t("options")));
  parts.push(el("div", { class: "card" }, [["clipboard", "clipboard"], ["keyboardFollows", "keyboard"], ["audioFollows", "audio"]].map(([k, label]) =>
    el("div", { class: "row" }, el("div", { class: "grow" }, t(label)), toggle(k)))));
  parts.push(el("p", { class: "note" }, t("safety")));
  app.replaceChildren(...parts);
}

async function act(fn) {
  try { st = await fn(); err = null; } catch (e) { err = e; if (st) alertInline(e.message); }
  render();
}
function alertInline(msg) { if (st && st.outgoing) st.outgoing.error = msg; }

let last = "";
async function poll() {
  if (token) {
    try {
      const s = await call("state");
      const text = JSON.stringify(s);
      // Do not re-render while the person types the code, unless something changed.
      if (text !== last) { st = s; err = null; last = text; if (!(document.activeElement && document.activeElement.classList.contains("code-in") && s.outgoing?.status === "code")) render(); }
    } catch (e) { if (!st) { err = e; render(); } }
  }
  setTimeout(poll, 1000);
}
render();
poll();
</script>
