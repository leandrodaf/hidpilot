[package]
name = "hidpilot"
version = "0.1.0"
description = "Configure Logitech mice, keyboards and headsets on Linux"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native", "macos-shared-device"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
x11rb = "0.14.0"

[workspace]
members = [".", "flow", "gui"]
